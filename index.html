
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quỹ Nhà Mình</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f6efff;
      color: #604480;
      padding: 20px;
      margin: 0;
    }
    h1 {
      text-align: center;
      margin-top: 35px;
    }
    .card {
      background: white;
      padding: 20px;
      border-radius: 20px;
      margin: 15px 0;
      box-shadow: 0 3px 12px #e8dcf5;
    }
    button {
      background: #b79ae8;
      color: white;
      border: none;
      padding: 15px;
      border-radius: 12px;
      width: 100%;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <h1>💜 Quỹ Nhà Mình</h1>
  <p style="text-align:center">
    Cùng nhau quản lý chi tiêu gia đình
  </p>

  <div class="card">
    <h3>🏠 Quỹ chung gia đình</h3>
    <p>💰 Tổng thu: 0đ</p>
    <p>💸 Tổng chi: 0đ</p>
    <p>🎯 Ngân sách tháng: Chưa thiết lập</p>
  </div>

  <div class="card">
    <h3>📝 Chi tiêu gần đây</h3>
    <p>Chưa có giao dịch nào</p>
    <button>+ Thêm giao dịch</button>
  </div>

  <div class="card">
    <h3>👨‍👩‍👧 Thành viên gia đình</h3>
    <p>Hỗ trợ 3 thành viên</p>
  </div>
</body>
</html>
